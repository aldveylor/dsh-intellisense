# NamespaceRuntime owns ptcRuntime; the base Node backend exposes only flat tools.
- id: ptc-runtime
  disabled: true
- insert:
    - id: intellisense
      name: dsh-intellisense
      config:
        timeoutMs: 120000
    - id: preset-intellisense-ptc
      name: dsh-intellisense/preset
- id: agent-preset-registry
  config:
    default: intellisense-ptc
    selectedDefault: intellisense-ptc
