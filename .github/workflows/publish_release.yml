name: Publish release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release files
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/release_files"
          mkdir -p "$release_dir"
          cp -a cordis.patch.yml package.json dist presets README.md docs "$release_dir/"
          RELEASE_DIR="$release_dir" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const path = join(process.env.RELEASE_DIR, 'package.json');
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          delete manifest.scripts;
          delete manifest.devDependencies;
          manifest.files = ['cordis.patch.yml', 'dist', 'presets', 'README.md', 'docs'];
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Package release
        shell: bash
        run: tar -czf "$RUNNER_TEMP/dsh_intellisense.tar.gz" -C "$RUNNER_TEMP/release_files" .

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag='release'
          existing_release=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$release_tag\") | .id")
          if [[ -n "$existing_release" ]]; then
            gh release delete "$release_tag" --yes --cleanup-tag
          fi
          gh release create "$release_tag" "$RUNNER_TEMP/dsh_intellisense.tar.gz" \
            --target "$GITHUB_SHA" \
            --title 'Release' \
            --notes "Built from $GITHUB_SHA." \
            --latest

      - name: Remove legacy release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_branch=$(gh api "repos/$GH_REPO/git/matching-refs/heads/release" --jq '.[] | select(.ref == "refs/heads/release") | .ref')
          if [[ -n "$release_branch" ]]; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/release"
          fi
