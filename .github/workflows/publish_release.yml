name: Publish version release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-version-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect version commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/release_versions.tsv"
          import { collectVersions } from './scripts/release/collect_versions.mjs';
          for (const { commit, name, version } of collectVersions(process.env.BEFORE, process.env.AFTER)) {
            console.log([commit, name.split('/').at(-1), version].join('\t'));
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Dependency installation is optional, so the pnpm store may not exist.
          package-manager-cache: false

      - name: Build and publish each version commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while IFS=$'\t' read -r COMMIT PROJECT_NAME VERSION; do
            if gh release view "v$VERSION" > /dev/null 2>&1; then
              echo "Skipping existing release v$VERSION"
              continue
            fi
            git fetch --tags origin
            PREVIOUS_RELEASE=''
            SHORTEST_DISTANCE=''
            gh api "repos/$GH_REPO/releases" --paginate \
              --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/release_tags.txt"
            while IFS= read -r TAG; do
              if ! git rev-parse --verify "refs/tags/$TAG^{commit}" > /dev/null 2>&1; then
                continue
              fi
              if ! git merge-base --is-ancestor "refs/tags/$TAG" "$COMMIT"; then
                continue
              fi
              DISTANCE=$(git rev-list --count "refs/tags/$TAG..$COMMIT")
              if [ "$DISTANCE" -gt 0 ] && { [ -z "$SHORTEST_DISTANCE" ] || [ "$DISTANCE" -lt "$SHORTEST_DISTANCE" ]; }; then
                PREVIOUS_RELEASE="refs/tags/$TAG"
                SHORTEST_DISTANCE="$DISTANCE"
              fi
            done < "$RUNNER_TEMP/release_tags.txt"
            COMMIT_RANGE="$COMMIT"
            if [ -n "$PREVIOUS_RELEASE" ]; then
              COMMIT_RANGE="$PREVIOUS_RELEASE..$COMMIT"
            fi
            {
              git log --format='- %s (%h)' -n 30 "$COMMIT_RANGE"
              if [ "$(git rev-list --count "$COMMIT_RANGE")" -gt 30 ]; then
                printf '\n...\n'
              fi
            } > "$RUNNER_TEMP/release_notes.md"
            SOURCE_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/release_source.XXXXXX")
            git archive "$COMMIT" | tar -x -C "$SOURCE_DIRECTORY"
            (
              cd "$SOURCE_DIRECTORY"
              if [ -f pnpm-lock.yaml ]; then
                pnpm install --frozen-lockfile
                pnpm run build
              else
                npm ci
                npm run build
              fi
              export PROJECT_NAME VERSION
              ARCHIVE_NAME=$(node --input-type=commonjs <<'NODE'
          const { mkdirSync, renameSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const directory = 'build/release';
          mkdirSync(directory, { recursive: true });
          const [archive] = JSON.parse(execFileSync('npm', ['pack', '--ignore-scripts', '--json', '--pack-destination', directory], { encoding: 'utf8' }));
          const archiveName = `${process.env.PROJECT_NAME}-v${process.env.VERSION}.tar.gz`;
          renameSync(`${directory}/${archive.filename}`, `${directory}/${archiveName}`);
          console.log(archiveName);
          NODE
              )
              gh release create "v$VERSION" "build/release/$ARCHIVE_NAME" \
                --target "$COMMIT" --title "$PROJECT_NAME v$VERSION" --notes-file "$RUNNER_TEMP/release_notes.md"
            )
            rm -rf "$SOURCE_DIRECTORY"
          done < "$RUNNER_TEMP/release_versions.tsv"
