name: Publish artifact tag

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release files
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/release_files"
          mkdir -p "$release_dir"
          cp -a cordis.patch.yml package.json dist presets README.md docs "$release_dir/"
          RELEASE_DIR="$release_dir" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const path = join(process.env.RELEASE_DIR, 'package.json');
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          delete manifest.scripts;
          delete manifest.devDependencies;
          manifest.files = ['cordis.patch.yml', 'dist', 'presets', 'README.md', 'docs'];
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish artifact tag
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Store only build artifacts while preserving the source commit as parent.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git read-tree --empty
          git --work-tree="$RUNNER_TEMP/release_files" add --all --force
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -m "chore: publish artifacts from $GITHUB_SHA")

          # Replace the fixed tag and remove the legacy branch in one transaction.
          branch_deletion=()
          if [[ -n "$(git ls-remote --heads origin refs/heads/release)" ]]; then
            branch_deletion=(':refs/heads/release')
          fi
          git push --atomic origin "+$commit:refs/tags/release" "${branch_deletion[@]}"
